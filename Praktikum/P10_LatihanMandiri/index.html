<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penentu Kategori Usia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Penentu Kategori Usia</h1>
        <p class="subtitle">Masukkan usia untuk menentukan kategori tahap perkembangan.</p>
        
        <div class="form-group">
            <label for="inputUsia">Masukkan Usia (Tahun):</label>
            <input type="number" id="inputUsia" min="0" value="20">
        </div>
        <button id="btnCek">Cek Kategori</button>

        <div id="hasil" class="result" style="display: none;">
            <h3>Hasil Analisis</h3>
            <p>Usia: <strong id="valUsia">-</strong> tahun</p>
            <p>Kategori: <strong id="valKategori" style="color: #1d4ed8;">-</strong></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
