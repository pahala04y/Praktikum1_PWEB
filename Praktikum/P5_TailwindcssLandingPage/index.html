<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landing Page - Tailwind CSS</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-6 md:p-12">

  <header class="max-w-5xl mx-auto text-center mb-10">
    <h1 class="text-4xl font-extrabold text-blue-600 underline decoration-wavy">
      Galeri Pemandangan Tailwind CSS
    </h1>
  </header>

  <main class="max-w-5xl mx-auto space-y-12">

    <!-- Kolom Gambar Pemandangan -->
    <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
      <h2 class="text-2xl font-bold mb-4 text-slate-700">1. Tata Letak Kolom & Gambar</h2>
      
      <div class="columns-1 md:columns-3 gap-4 space-y-4">
        <img class="aspect-3/2 w-full object-cover rounded-xl shadow" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Pemandangan 1" />
        <img class="aspect-square w-full object-cover rounded-xl shadow" src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05" alt="Pemandangan 2" />
        <img class="aspect-square w-full object-cover rounded-xl shadow" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTKquymzfAXBx-C8GrW5qjeQgdya96_vKBFv_hbW23Ylw&s=10" alt="Pemandangan 3" />
      </div>
    </section>

    <!-- Bagian 2: Kotak Konten Scroll Horizontal -->
    <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
      <h2 class="text-2xl font-bold mb-4 text-slate-700">2. Konten Gulir Horizontal (Overflow)</h2>
      
      <div class="overflow-x-auto flex space-x-4 pb-4">
        <div class="min-w-[250px] p-6 bg-blue-50 rounded-xl border border-blue-100 font-semibold text-blue-700">Card Item 1 (Geser ke samping)</div>
        <div class="min-w-[250px] p-6 bg-blue-50 rounded-xl border border-blue-100 font-semibold text-blue-700">Card Item 2</div>
        <div class="min-w-[250px] p-6 bg-blue-50 rounded-xl border border-blue-100 font-semibold text-blue-700">Card Item 3</div>
        <div class="min-w-[250px] p-6 bg-blue-50 rounded-xl border border-blue-100 font-semibold text-blue-700">Card Item 4</div>
      </div>
    </section>

    <!-- Bagian 3: CSS Grid & Subgrid -->
    <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
      <h2 class="text-2xl font-bold mb-4 text-slate-700">3. Sistem Grid & Subgrid</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 text-center font-semibold text-white">
        <div class="bg-blue-500 p-4 rounded-lg">01</div>
        <div class="bg-blue-500 p-4 rounded-lg">02</div>
        <div class="bg-blue-500 p-4 rounded-lg">03</div>
        <div class="bg-blue-500 p-4 rounded-lg">04</div>
        <div class="bg-slate-700 p-4 rounded-lg">05</div>
        
        <!-- gabungan kolom/subgrid -->
        <div class="md:col-span-3 grid grid-cols-1 md:grid-cols-subgrid gap-4 bg-slate-100 p-4 rounded-lg text-slate-700">
          <div class="bg-emerald-500 text-white p-2 rounded col-start-2">06 (Subgrid)</div>
        </div>
      </div>
    </section>

  </main>

  <footer class="text-center mt-12 text-slate-400 text-sm">
    <p>&copy; 2026 Praktikum Tailwind CSS - Universitas Jambi</p>
  </footer>

</body>
</html>
