<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Bootstrap</title>
    <!-- Memanggil CSS Bootstrap dari folder lokal -->
    <link href="asset/bs/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    
    <header>
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg bg-info navbar-light shadow-sm">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="#">HIMASI</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Link</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                Dropdown
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">Action</a></li>
                                <li><a class="dropdown-item" href="#">Another action</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="#">Something else here</a></li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                        </li>
                    </ul>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                        <button class="btn btn-outline-success" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>

    <!-- Carousel (Slider Gambar) dipisah di luar tag nav agar rapi -->
    <div id="carouselExample" class="carousel slide container mt-4" data-bs-ride="carousel">
        <div class="carousel-inner rounded shadow">
            <div class="carousel-item active">
                <img src="https://placehold.co/1200x400/0dcaf0/ffffff?text=Slide+1+HIMASI" class="d-block w-100" alt="Slide 1">
            </div>
            <div class="carousel-item">
                <img src="https://placehold.co/1200x400/6610f2/ffffff?text=Slide+2+Praktikum" class="d-block w-100" alt="Slide 2">
            </div>
            <div class="carousel-item">
                <img src="https://placehold.co/1200x400/198754/ffffff?text=Slide+3+Bootstrap" class="d-block w-100" alt="Slide 3">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <main class="container mt-5">
        <h1 class="text-primary fw-bold">Hello World</h1>
        <p class="text-muted">Praktikum Pemrograman Berbasis Web - Universitas Jambi</p>
    </main>

    <script src="asset/bs/js/bootstrap.bundle.min.js"></script>
</body>
</html>
