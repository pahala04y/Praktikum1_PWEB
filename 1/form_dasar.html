<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Membuat Form HTML</title>
</head>
<body>
    <h1>Formulir Pendaftaran Kegiatan Mahasiswa</h1>
    <form action="#" method="post">
        <fieldset>
            <legend>Data Diri Mahasiswa</legend>
            <p>
                <label for="nim">NIM *</label><br>
                <input type="text" id="nim" name="nim" value="" placeholder="Masukkan NIM Anda" required>
            </p>
            <p>
                <label for="nama_mhs">Nama Mahasiswa:</label><br>
                <input type="text" id="nama_mhs" name="nama_mhs" value="" placeholder="Masukkan Nama Anda" required>
            </p>
            <p>
                <label for="jenis_kelamin">Jenis Kelamin:</label><br>
                <input type="radio" name="jenis_kelamin" value="L" required> Laki-laki
                <input type="radio" name="jenis_kelamin" value="P" required> Perempuan
            </p>
            <p>
                <label for="email">Email:</label><br>
                <input type="email" name="email" placeholder="Masukkan Email Anda" required>
            </p>
            <p>
                <label for="prodi">Program Studi:</label><br>
                <select name="prodi" id="prodi" required>
                    <option value="">-- Pilih Program Studi --</option>
                    <option value="SI">Sistem Informasi</option>
                    <option value="IF">Informatika</option>
                    <option value="TE">Teknik Elektro</option>
                </select>
            </p>
            <p>
                <label for="angkatan">Angkatan:</label><br>
                <input type="number" name="angkatan" min="2020" max="2030"placeholder="Tahun" required>
            </p>
            <p>
                <label for="foto">Pas Foto:</label><br>
                <input type="file" name="foto">
            </p>
        </fieldset>
        <fieldset>
            <legend>Pilihan Kegiatan</legend>
            <p>
                <label for="topik">Topik yang diminati:</label><br>
                <input type="checkbox" name="topik[]" value="html"> HTML <br>
                <input type="checkbox" name="topik[]" value="css"> CSS <br>
                <input type="checkbox" name="topik[]" value="javascript"> JavaScript <br>
            </p>
            <p>
                <label for="alasan">Alasan:</label><br>
                <textarea name="alasan" id="alasan" rows="5" cols="50" maxlength="400" placeholder="Masukkan alasan Anda"></textarea>
            </p>
        </fieldset>
        <label>
            <input type="checkbox" name="pernyataan" required>
            Saya menyatakan bahwa data yang saya isi adalah benar.
        </label>
        <br><br>
        <button type="submit">Kirim</button>
        <button type="reset">Batal</button>
</body>
</html>
